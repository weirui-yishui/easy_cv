<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Easy CV</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
<style id="cv-page-style"></style><!-- 打印纸张 / 页边距 / 页码，由 render.js 按 state.settings 写入 -->
<style id="cv-page-names"></style><!-- 每页单独页边距的 @page pN，由分页预览写入 -->
</head>
<body>
<div id="app">
  <header class="toolbar">
    <span class="brand">◆ Easy CV</span>
    <button class="btn" data-act="undo" id="btn-undo" title="撤销 (Ctrl+Z)">↩ 撤销</button>
    <button class="btn" data-act="redo" id="btn-redo" title="重做 (Ctrl+Y)">↪ 重做</button>
    <span class="sep"></span>
    <button class="btn" data-act="dd-theme" id="btn-theme" title="主题">主题 ▾</button>
    <button class="btn" data-act="dd-color" id="btn-color" title="配色">配色 ▾</button>
    <button class="btn" data-act="toggle-layout" id="btn-layout" title="显示 / 收起右侧排版面板">排版</button>
    <button class="btn" data-act="dd-settings" id="btn-settings" title="设置">⚙ 设置</button>
    <span class="spacer"></span>
    <span class="save-target" id="save-target" title="Ctrl+S 保存位置"></span>
    <button class="btn" data-act="import">导入</button>
    <button class="btn" data-act="export" id="btn-export">导出</button>
    <button class="btn primary" data-act="print" title="Ctrl+P">打印 / 导出 PDF</button>
  </header>

  <div class="app-body">
    <aside class="editor-pane">
      <div class="block-scroll">
        <p class="pane-title">Blocks</p>
        <div class="block-list" id="block-list"></div>
      </div>
      <button class="add-block-btn" data-act="add-block" title="添加块">+</button>
    </aside>

    <section class="preview-wrap">
      <div class="zoom-bar">
        <button class="btn small" data-act="toggle-jump" id="btn-jump" title="开启后，点击预览里的条目会在左侧定位到对应的块">点击定位</button>
        <span class="spacer"></span>
        <button class="btn small" data-act="zoom-out" title="缩小">−</button>
        <span id="zoom-label">100%</span>
        <button class="btn small" data-act="zoom-in" title="放大">+</button>
        <button class="btn small" data-act="zoom-fit" id="zoom-fit" title="按窗口宽度缩放（最大 100%）">适应宽度</button>
      </div>
      <main class="preview-pane" id="preview-pane"></main>
    </section>

    <aside class="layout-pane" id="layout-pane">
      <div class="layout-head">
        <span class="pane-title">排版</span>
        <button class="blk-btn" data-act="toggle-layout" title="收起">»</button>
      </div>
      <div class="layout-scroll">
        <div id="layout-rows"></div>
        <div class="layout-actions"><button class="btn small" data-act="layout-reset">恢复默认</button></div>
      </div>
    </aside>
  </div>
</div>

<!-- 弹层：主题 / 导出 / 添加块 / 块操作 / 设置 -->
<div class="menu" id="themeMenu" hidden>
  <div class="menu-item" data-act="theme" data-theme="classic">经典（衬线）</div>
  <div class="menu-item" data-act="theme" data-theme="modern">现代（无衬线）</div>
</div>
<div class="menu" id="colorMenu" hidden>
  <div class="color-swatches" id="color-swatches"></div>
  <div class="color-custom">
    <input type="text" id="accent-input" placeholder="#1a3a5c" spellcheck="false" autocomplete="off">
    <button class="btn small" id="accent-add" data-act="accent-add" title="把输入的颜色加为色块（编辑模式下为保存）">+ 添加</button>
  </div>
  <div class="menu-item" data-act="accent-random">🎲 随机配色</div>
  <div class="color-current"><span>当前色号</span><code id="accent-current">#1a3a5c</code></div>
</div>
<div class="menu" id="swatchMenu" hidden>
  <div class="menu-item" data-act="swatch-edit">✎ 修改颜色</div>
  <div class="menu-item danger" data-act="swatch-del">✕ 删除</div>
</div>
<div class="menu" id="addMenu" hidden></div>
<div class="menu" id="convertMenu" hidden></div>
<div class="menu" id="blockMenu" hidden>
  <div class="menu-item" data-act="menu-insert">+ 在此后插入</div>
  <div class="menu-item" data-act="menu-dup">⧉ 复制</div>
  <div class="menu-item" data-act="menu-convert" id="menu-convert">⇄ 转换为…</div>
  <div class="menu-item" data-act="menu-break" id="menu-break">☐ 允许跨页</div>
  <div class="menu-item danger" data-act="menu-del">✕ 删除</div>
</div>

<div class="modal-mask" id="settings-modal" hidden>
  <div class="modal">
    <h3>设置</h3>
    <div class="field">
      <label>日期格式</label>
      <select id="set-datefmt">
        <option value="MMM YYYY">2022-06 → Jun 2022</option>
        <option value="YYYY-MM">2022-06 → 2022-06</option>
        <option value="YYYY.MM">2022-06 → 2022.06</option>
        <option value="YYYY年M月">2022-06 → 2022年6月</option>
      </select>
    </div>
    <div class="field">
      <label>语言 / 小节标题</label>
      <select id="set-lang">
        <option value="en">English（Education / Work Experience …）</option>
        <option value="zh">中文（教育经历 / 工作经历 …）</option>
      </select>
    </div>
    <div class="field">
      <label>小节标题（留空 = 按语言自动）</label>
      <div class="section-title-grid" id="set-section-titles"></div>
    </div>
    <div class="modal-actions">
      <button class="btn primary" data-act="save-settings">保存</button>
      <button class="btn" data-act="close-settings">取消</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="sections-modal" hidden>
  <div class="modal">
    <h3>管理栏目</h3>
    <p class="modal-hint">这里的栏目会出现在「+」菜单里，新建时自动填好小节标题和版式。列表只保存在本浏览器；删掉栏目不影响已经写好的内容。</p>
    <div class="tpl-head"><span>中文标题</span><span>英文标题（可选）</span><span>版式</span><span></span></div>
    <div id="tpl-rows"></div>
    <button class="btn small" data-act="tpl-add">+ 添加栏目</button>
    <div class="modal-actions">
      <button class="btn" data-act="tpl-reset" style="margin-right:auto">恢复预设</button>
      <button class="btn primary" data-act="tpl-save">保存</button>
      <button class="btn" data-act="tpl-close">取消</button>
    </div>
  </div>
</div>

<input type="file" id="import-file" accept=".json,application/json" hidden>
<input type="file" id="photo-file" accept="image/*" hidden>
<div id="toast" hidden></div>

<!-- 模块化加载：普通 <script>（非 ES module）在 file:// 下可用 -->
<script src="js/utils.js"></script>
<script src="js/photo.js"></script>
<script src="js/blocks.js"></script>
<script src="js/themes.js"></script>
<script src="js/store.js"></script>
<script src="js/render.js"></script>
<script src="js/editor.js"></script>
<script src="js/export.js"></script>
<script src="js/sample.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
